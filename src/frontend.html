<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>GUI</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        #container {
            text-align: center;
            padding: 28px 24px 32px;
            background: #fff;
            border: 1px solid #d8d8d8;
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            max-width: 760px;
            width: calc(100% - 40px);
        }

        #image-wrapper {
            position: relative;
            width: 100%;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid #ccc;
            background: #e8e8e8;
            overflow: hidden;
        }

        #main-image {
            max-width: 100%;
            height: auto;
            display: none;
        }

        #image-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 16px;
            text-align: center;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .seed-display {
            margin-top: 14px;
            font-size: 0.95rem;
            color: #444;
            font-family: Consolas, monospace;
            letter-spacing: 0.08em;
        }

        .seed-display strong {
            color: #111;
            font-weight: 700;
        }

        .controls label {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.95rem;
            color: #333;
        }

        .controls input[type="text"] {
            margin-top: 6px;
            padding: 8px 10px;
            width: 175px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
        }

        .controls button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .controls button:hover {
            background: #125ea9;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="image-wrapper">
            <img id="main-image" alt="Rendered image" src="" />
            <div id="image-placeholder">Loading image…</div>
        </div>

        <div class="controls">
            <button id="generate-btn" type="button">GENERATE</button>
            <label>
                SEED
                <input id="seed-input" type="text" maxlength="16" pattern="[A-Fa-f0-9]" placeholder="0000000000000000"
                    autocomplete="off" inputmode="latin" />
            </label>
            <button id="download-btn" type="button">DOWNLAND</button>
            <button id="print-btn" type="button">PRINT</button>
        </div>

        <div id="seed-display" class="seed-display">
            SEED USED: <strong id="seed-value">—</strong>
        </div>
    </div>

    <script>
        const imagePath = '/image';
        const imageEl = document.getElementById('main-image');
        const placeholderEl = document.getElementById('image-placeholder');
        const seedInput = document.getElementById('seed-input');
        const seedValueEl = document.getElementById('seed-value');
        const generateBtn = document.getElementById('generate-btn');
        const downloadBtn = document.getElementById('download-btn');
        const printBtn = document.getElementById('print-btn');

        function imageUrl() {
            return `${imagePath}?ts=${Date.now()}`;
        }

        function refreshImage() {
            placeholderEl.style.display = 'flex';
            imageEl.style.display = 'none';
            imageEl.src = imageUrl();
        }

        function updateSeedDisplay(value) {
            const normalized = (value || '').trim().toUpperCase();
            seedValueEl.textContent = normalized || '—';
        }

        async function getSeed() {
            const url = `/generate?seed=${encodeURIComponent(seedInput.value)}`;

            try {
                const response = await fetch(url, {
                    method: 'GET'
                });

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                const seedText = await response.text();
                const usedSeed = seedText && seedText.trim() ? seedText.trim() : seedInput.value;
                const normalizedSeed = usedSeed.toUpperCase();
                seedInput.value = normalizedSeed;
                return normalizedSeed;
            } catch (error) {
                console.error(error);
                const fallbackSeed = seedInput.value.toUpperCase();
                seedInput.value = fallbackSeed;
                return fallbackSeed;
            }
        }

        imageEl.addEventListener('load', () => {
            placeholderEl.style.display = 'none';
            imageEl.style.display = 'block';
        });

        imageEl.addEventListener('error', () => {
            placeholderEl.textContent = 'Unable to load image';
            placeholderEl.style.display = 'flex';
            imageEl.style.display = 'none';
        });

        refreshImage();
        updateSeedDisplay(seedInput.value);

        seedInput.addEventListener('input', () => {
            const allowed = seedInput.value.replace(/[^a-fA-F0-9]/g, '').slice(0, 16);
            if (seedInput.value !== allowed) {
                seedInput.value = allowed;
            }
            seedInput.value = seedInput.value.toUpperCase();
            updateSeedDisplay(seedInput.value);
        });

        generateBtn.addEventListener('click', async () => {
            const seed = await getSeed();
            updateSeedDisplay(seed);
            refreshImage();
        });

        downloadBtn.addEventListener('click', () => {
            if (!imageEl.src) {
                return;
            }

            const anchor = document.createElement('a');
            anchor.href = imageEl.src;
            anchor.download = 'image.png';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        });

        printBtn.addEventListener('click', () => {
            const printUrl = `/print-image?ts=${Date.now()}`;

            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                return;
            }

            const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Print Image</title>
<style>
@page { size: A4; margin: 0; }
html, body { margin: 0; padding: 0; height: 100%; }
body { display: flex; align-items: center; justify-content: center; background: #fff; }
img { max-width: 100%; max-height: 100%; display: block; }
</style>
</head>
<body>
<img src="${printUrl}" alt="Printable image" />
</body>
</html>`;

            printWindow.document.open();
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.focus();
            printWindow.addEventListener('load', () => {
                printWindow.print();
            });
        });
    </script>
</body>

</html>
